<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Brick Artist</title>

<style>

body {
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,Arial;
    background:#eeeeee;
    text-align:center;
    touch-action:none;
}

h1 {
    font-size:22px;
    margin:12px;
}

#toolbar {
    background:white;
    padding:10px;
    position:sticky;
    top:0;
    z-index:10;
}

button, select, input {
    font-size:16px;
    padding:8px;
    margin:3px;
    border-radius:8px;
    border:1px solid #aaa;
}


#grid {

    display:grid;
    grid-template-columns:repeat(32,1fr);

    width:94vw;
    max-width:600px;

    aspect-ratio:1;

    margin:10px auto;

    background:white;
    border:2px solid #333;

}


.cell {

    border:0.5px solid #ddd;
    position:relative;

}


.piece {

    width:100%;
    height:100%;

}


.round {

    border-radius:50%;

}


.curve {

    border-radius:100% 0 0 0;

}


#bottom {

    position:fixed;
    bottom:0;
    left:0;
    right:0;

    background:white;
    padding:8px;

}


</style>

</head>


<body>


<h1>🧱 Brick Artist</h1>


<div id="toolbar">

<select id="piece">

<option value="square">■ 1x1</option>
<option value="round">● Rond</option>
<option value="rect">▬ 1x2</option>
<option value="curve">◜ Courbe</option>

</select>


<input type="color" id="color" value="#ff0000">


<button onclick="clearGrid()">🗑</button>


</div>


<div id="grid"></div>


<div id="bottom">

<button onclick="save()">💾 Sauver</button>

<button onclick="load()">↩ Charger</button>

<button onclick="exportImage()">📷 Image</button>

</div>


<script>


const size = 32;
const grid = document.getElementById("grid");

let cells = [];


// Création de la grille

for(let y=0; y<size; y++){

    for(let x=0; x<size; x++){

        let cell=document.createElement("div");

        cell.className="cell";

        cell.dataset.x=x;
        cell.dataset.y=y;


        cell.addEventListener("pointerdown", function(e){

            e.preventDefault();

            placePiece(x,y);

        });


        cell.addEventListener("contextmenu",function(e){

            e.preventDefault();

            erase(x,y);

        });


        grid.appendChild(cell);

        cells.push(cell);

    }

}



function getCell(x,y){

    return cells[y*size+x];

}




function placePiece(x,y){

    let type=document.getElementById("piece").value;

    let color=document.getElementById("color").value;



    if(type==="rect"){

        if(x>=31) return;

        paint(x,y,color);

        paint(x+1,y,color);

    }


    else if(type==="curve"){

        if(x>=31 || y>=31) return;


        paint(x,y,color);

        paint(x+1,y,color);

        paint(x,y+1,color);


    }


    else {


        let cell=getCell(x,y);

        cell.innerHTML="";


        let div=document.createElement("div");

        div.className="piece";


        if(type==="round"){

            div.classList.add("round");

        }


        div.style.background=color;


        cell.appendChild(div);


    }


    save();

}




function paint(x,y,color){

    let cell=getCell(x,y);

    cell.innerHTML="";

    let div=document.createElement("div");

    div.className="piece";

    div.style.background=color;

    cell.appendChild(div);

}





function erase(x,y){

    let cell=getCell(x,y);

    cell.innerHTML="";

    save();

}





function clearGrid(){

    cells.forEach(c=>{

        c.innerHTML="";

    });


    save();

}





function save(){

    let data=[];


    cells.forEach((c,i)=>{

        data[i]=c.innerHTML;

    });


    localStorage.setItem(

        "brickArtist",

        JSON.stringify(data)

    );

}





function load(){

    let data=

    JSON.parse(localStorage.getItem("brickArtist"));


    if(!data)return;


    cells.forEach((c,i)=>{

        c.innerHTML=data[i] || "";

    });

}





function exportImage(){

    alert(

    "Export image : prochaine amélioration. Pour l'instant le motif est sauvegardé dans ton navigateur."

    );

}


// Chargement automatique

load();


</script>

</body>

</html>
